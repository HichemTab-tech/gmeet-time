name: Publish Chrome Web Store Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '24'
      PNPM_VERSION: '11'
      ZIP_FILE: gmeet-time.zip
      ITEM_NAME: publishers/${{ secrets.CWS_PUBLISHER_ID }}/items/${{ secrets.CWS_EXTENSION_ID }}
      CWS_PUBLISH_TYPE: DEFAULT_PUBLISH
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build

      - name: Pack extension bundle
        run: |
          cd dist
          zip -r ../${{ env.ZIP_FILE }} .

      - name: Upload packaged extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-package
          path: ${{ env.ZIP_FILE }}

      - name: Exchange refresh token for access token
        id: auth
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          response=$(curl --fail-with-body -sS https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token)

          access_token=$(echo "$response" | jq -r '.access_token')

          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "Unable to obtain access token"
            echo "$response"
            exit 1
          fi

          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

      - name: Upload package to Chrome Web Store
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          response=$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -T "${{ env.ZIP_FILE }}" \
            "https://chromewebstore.googleapis.com/upload/v2/${{ env.ITEM_NAME }}:upload")

          echo "$response"

          upload_state=$(echo "$response" | jq -r '.uploadState // empty')

          if [ "$upload_state" = "FAILED" ]; then
            exit 1
          fi

      - name: Wait for upload processing if needed
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          for attempt in $(seq 1 18); do
            response=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "x-goog-api-version: 2" \
              "https://chromewebstore.googleapis.com/v2/${{ env.ITEM_NAME }}:fetchStatus")

            echo "$response"

            upload_state=$(echo "$response" | jq -r '.lastAsyncUploadState // "SUCCEEDED"')

            if [ "$upload_state" = "SUCCEEDED" ] || [ "$upload_state" = "NOT_FOUND" ]; then
              exit 0
            fi

            if [ "$upload_state" = "FAILED" ]; then
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Chrome Web Store upload processing"
          exit 1

      - name: Submit release for publish
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          response=$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-version: 2" \
            -d "{\"publishType\":\"${{ env.CWS_PUBLISH_TYPE }}\"}" \
            "https://chromewebstore.googleapis.com/v2/${{ env.ITEM_NAME }}:publish")

          echo "$response"

          state=$(echo "$response" | jq -r '.state // empty')

          if [ -z "$state" ] || [ "$state" = "REJECTED" ] || [ "$state" = "CANCELLED" ]; then
            exit 1
          fi
